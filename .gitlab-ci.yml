stages:
  - validate
  - fetch-binaries
  - build
  - extras
  - package
  - upload
  - release

default:
  tags: [shell-executor]

hlint:
  stage: validate
  rules: &if_merge_request
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - nix-shell -p haskellPackages.hlint --run ./scripts/hlint.sh

check-trailing-whitespace:
  stage: validate
  rules: *if_merge_request
  script:
    - ./scripts/check-trailing-whitespace.sh

fetch-linux-binaries:
  stage: fetch-binaries
  rules: *if_merge_request
  script:
    - nix-build dep/linux-tezos-binaries/build.nix

fetch-macos-binaries:
  stage: fetch-binaries
  rules: *if_merge_request
  script:
    - nix-build dep/brew-tezos-binaries/build.nix

build-kiln:
  stage: build
  rules: *if_merge_request
  script:
    - nix-build -A exe --argstr closure-compiler-setting "BUNDLE" --no-out-link

build-kiln-darwin:
  stage: build
  rules: *if_merge_request
  tags: [darwin]
  allow_failure: true
  script:
    - nix-build -A exe --argstr closure-compiler-setting "BUNDLE" --argstr system "x86_64-darwin" --no-out-link

xrefcheck:
  stage: extras
  rules: *if_merge_request
  allow_failure: true
  script:
    - nix shell -f ./dep/xrefcheck -c xrefcheck
  retry:
    max: 2
    when: script_failure

build-docker-image:
  stage: package
  rules: &if_tag
    - if: '$CI_COMMIT_TAG != null'
  script:
    - nix-build -A dockerImage --out-link docker-image
  artifacts:
    paths:
      - docker-image

build-deb-package:
  stage: package
  rules: *if_tag
  script:
    - nix-build -A kiln-debian --out-link debian
  artifacts:
    paths:
      - debian/*

build-darwin-octez-stable:
  stage: build
  tags: [darwin]
  when: manual
  rules: &if_develop
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/octez"
    HEADER: "JOB-TOKEN: $CI_JOB_TOKEN"
    HOMEBREW_DEVELOPER: "1"
    FORMULA_URL: "https://packages.nomadic-labs.com/homebrew/Formula/octez.rb"
  script: &build_darwin_octez
    - nix-shell -p curl --run 'curl -q "$FORMULA_URL" -O'
    - /usr/bin/arch -x86_64 brew install --formula --build-bottle ./octez.rb
    - /usr/bin/arch -x86_64 brew bottle --force-core-tap --no-rebuild ./octez.rb
    - export BOTTLE_NAME="$(basename "$(ls ./*.bottle.tar.gz)")"
    - export OCTEZ_VERSION="$(sed -nE 's/.*version "(.*)".*/\1/p' octez.rb)"
    - nix-shell -p curl --run 'curl --header "$HEADER" --upload-file "./$BOTTLE_NAME" "$PACKAGE_REGISTRY_URL/$OCTEZ_VERSION/$BOTTLE_NAME"'
  after_script: &cleanup_darwin_octez
    - /usr/bin/arch -x86_64 brew uninstall --formula ./octez.rb || true

build-darwin-octez-rc:
  stage: build
  tags: [darwin]
  when: manual
  rules: *if_develop
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/octez"
    HEADER: "JOB-TOKEN: $CI_JOB_TOKEN"
    HOMEBREW_DEVELOPER: "1"
    FORMULA_URL: "https://packages.nomadic-labs.com/homebrew/RC/Formula/octez.rb"
  script: *build_darwin_octez
  after_script: *cleanup_darwin_octez

build-darwin-package:
  stage: package
  tags: [darwin]
  rules: *if_tag
  script:
    - nix run gitlab:tezos-kiln/kiln-macos-pkg#mkpkg -- "$CI_COMMIT_TAG" "$PWD"
  artifacts:
    paths:
      - build/kiln-*.pkg

upload-release-artifacts:
  stage: upload
  rules: &if_release_tag
    - if: '$CI_COMMIT_TAG =~ /rc/'
      when: never
    - if: '$CI_COMMIT_TAG != null'
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kiln/${CI_COMMIT_TAG}"
    HEADER: "JOB-TOKEN: $CI_JOB_TOKEN"
  needs:
    - build-docker-image
    - build-deb-package
    - build-darwin-package
  script:
    - export DEST_CREDS="$CI_REGISTRY_USER":"$CI_REGISTRY_PASSWORD"
    - nix-shell -p skopeo --run 'skopeo --insecure-policy copy --dest-creds "$DEST_CREDS" docker-archive:./docker-image docker://"$CI_REGISTRY_IMAGE":"$CI_COMMIT_TAG"'
    - export DEB_PACKAGE_NAME="$(basename "$(ls ./debian/*.deb)")"
    - nix-shell -p curl --run 'curl --header "$HEADER" --upload-file "./debian/$DEB_PACKAGE_NAME" "$PACKAGE_REGISTRY_URL/$DEB_PACKAGE_NAME"'
    - echo "DEB_PACKAGE_NAME=$DEB_PACKAGE_NAME" >> build.env
    - export PKG_NAME="$(basename "$(ls ./build/*.pkg)")"
    - nix-shell -p curl --run 'curl --header "$HEADER" --upload-file "./build/$PKG_NAME" "$PACKAGE_REGISTRY_URL/$PKG_NAME"'
    - echo "PKG_NAME=$PKG_NAME" >> build.env
  artifacts:
    reports:
      dotenv: build.env

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli
  needs:
    - upload-release-artifacts
  tags: []
  rules: *if_release_tag
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/kiln/${CI_COMMIT_TAG}"
  script:
    - >
      deb_asset="{\"name\": \"Debian/Ubuntu\", \"url\": \"$PACKAGE_REGISTRY_URL/$DEB_PACKAGE_NAME\"}"
    - >
      pkg_asset="{\"name\": \"MacOS\", \"url\": \"$PACKAGE_REGISTRY_URL/$PKG_NAME\"}"
    - >
      release-cli create --name "$CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --assets-link="$deb_asset" --assets-link="$deb_asset"
